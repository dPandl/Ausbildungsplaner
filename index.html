    <style>
      @keyframes modal-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes modal-out {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(0.95); }
      }
      @keyframes backdrop-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes backdrop-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Base styles for the backdrop */
      dialog::backdrop {
        backdrop-filter: blur(4px); /* equivalent to backdrop-blur-sm */
        background-color: rgb(15 23 42 / 0.2); /* bg-slate-900/20 */
        opacity: 0; /* Default to invisible to prevent flickering */
      }
      .dark dialog::backdrop {
        background-color: rgb(0 0 0 / 0.6); /* bg-black/60 */
      }
      
      /* The dialog[open]::backdrop rule was removed as it caused flickering. */
      /* We now rely on 'animation-fill-mode: forwards' to hold the final state. */

      /* Animate opening. 'forwards' holds the final state. */
      dialog[data-state='opening'] {
        animation: modal-in 0.2s ease-out forwards;
      }
      dialog[data-state='opening']::backdrop {
        animation: backdrop-in 0.2s ease-out forwards;
      }

      /* Animate closing. 'forwards' holds the final state */
      /* until the dialog is programmatically closed in JS. */
      dialog[data-state='closing'] {
        animation: modal-out 0.2s ease-in forwards;
      }
      dialog[data-state='closing']::backdrop {
        animation: backdrop-out 0.2s ease-in forwards;
      }

      /* Print styles */
      @media print {
        @page {
          size: A4;
          margin: 0cm;
        }
        body {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          background-color: #fff !important; /* Ensure background is white */
        }
        
        /* Hide everything by default using visibility */
        body * {
          visibility: hidden;
        }
        
        /* Then, make the print container and everything inside it visible again */
        .print-container, .print-container * {
          visibility: visible;
        }
        
        /* Position the print container at the top-left of the page */
        .print-container {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
        
        .page-break {
          page-break-before: always;
          break-before: page;
        }
        .no-break {
           page-break-inside: avoid;
        }
      }
